name: Lint and check formatting

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  lint_prettier_and_test:
    # The screenshots use the system font, so CI must run the macOS version
    # that made the reference images. The `xcode-27` image runs macOS 27.
    # TODO: Use `macos-27` when GitHub adds that label.
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier with `--check`
        run: npx prettier --check .

      - name: Run Vitest
        run: npx playwright install && npx vitest
